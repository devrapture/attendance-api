services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance_dev_password
    ports:
      - '5433:5432'
    volumes:
      - attendance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attendance -d attendance']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  attendance_postgres_data:
